name: Generar tienda Fortnite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar tienda
        run: python generar_tienda.py

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: tienda-fortnite
          path: salida/  

name: Generar Tienda Fortnite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar tienda
        run: python generar_tienda.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: salida

  publicar:
    needs: generar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4